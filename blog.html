---
title: Blog
image_view: true
---
<h1 style="margin-bottom: 1cm" >Blog</h1>

{% if page.image_view %}
	{% for post in site.categories.blog %}
		<article class="post">
			{% include post-heading-cover.html post=post %}
			<a href="{{ post.url }}">
				{{ post.abstract }}
			</a>
		</article>
	{% endfor %}
{% endif %}
