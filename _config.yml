# ----
# Site

title: Vinicius Arruda
url: "https://viniciusarruda.github.io"
baseurl: 
google_analytics_key: 104945048
newsletter_action: 
disqus_shortname:

# Values for the jekyll-seo-tag gem (https://github.com/jekyll/jekyll-seo-tag)
logo: /siteicon.png
description: My portfolio and blog.
author:
  name: Vinicius Arruda
  email: viniciusferracoarruda@gmail.com
  twitter: # twitter username without the @ symbol
social:
  name: Vinicius Arruda
  links:
    - https://github.com/viniciusarruda/viniciusarruda.github.io

# -----
# Build

paginate: 10
paginate_path: "/:num/"
permalink: pretty

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      push_sidebar_down: true
      print_stylesheet: true
      comments: true
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "index.html"
    values:
      layout: "default"
      push_sidebar_down: true

gems:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE

# -----------
# CloudCannon

social_icons:
  - Facebook
  - Google Plus
  - Instagram
  - LinkedIn
  - Pinterest
  - Tumblr
  - Twitter
  - YouTube
  - RSS
